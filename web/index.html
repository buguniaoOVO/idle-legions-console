<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>Idle Legions 多开中控</title>
<link rel="stylesheet" href="/web/style.css">
</head>
<body>
<div class="app">

  <aside class="side">
    <div class="logo">
      <img class="logoimg" src="/web/logo.png" alt="">
      <div>
        <b>Idle Legions 多开中控</b>
        <span>LOCAL OPERATIONS</span>
      </div>
    </div>

    <nav id="nav">
      <button data-page="inst" class="on">
        <svg viewBox="0 0 16 16"><rect x="2" y="2.5" width="12" height="4.4" rx="1.2"/><rect x="2" y="9.1" width="12" height="4.4" rx="1.2"/></svg>
        <span>账号状态</span><em id="navInst">0</em>
      </button>
      <button data-page="loot">
        <svg viewBox="0 0 16 16"><path d="M8 2l1.7 3.7 4 .5-2.9 2.7.7 4L8 11l-3.5 1.9.7-4L2.3 6.2l4-.5z"/></svg>
        <span>掉落记录</span><em id="navLoot">0</em>
      </button>
      <button data-page="sandbox">
        <svg viewBox="0 0 16 16"><path d="M8 1.8l5.2 3v6.4L8 14.2 2.8 11.2V4.8z"/><path d="M2.8 4.8L8 7.9l5.2-3.1M8 7.9v6.3"/></svg>
        <span>沙箱</span><em id="navBox">0</em>
      </button>
      <button data-page="official">
        <svg viewBox="0 0 16 16"><circle cx="8" cy="8" r="6.2"/><path d="M1.8 8h12.4M8 1.8c3.2 3.4 3.2 9 0 12.4M8 1.8c-3.2 3.4-3.2 9 0 12.4"/></svg>
        <span>助手设置</span>
      </button>
      <button data-page="settings">
        <svg viewBox="0 0 16 16"><circle cx="8" cy="8" r="2.1"/><path d="M8 1.7v1.7M8 12.6v1.7M1.7 8h1.7M12.6 8h1.7M3.6 3.6l1.2 1.2M11.2 11.2l1.2 1.2M12.4 3.6l-1.2 1.2M4.8 11.2l-1.2 1.2"/></svg>
        <span>本工具设置</span>
      </button>
    </nav>

    <div class="sidefoot">
      <div class="online"><i id="sbLed"></i><span id="sbText">检测中</span></div>
      <div class="mono" id="portRange">8840—8843</div>
      <div class="tiny" id="verText">助手版本 —</div>
    </div>
  </aside>

  <main>
    <header class="top">
      <div class="ttl">
        <h1 id="pageTitle">账号状态</h1>
        <p id="pageSub"></p>
      </div>
      <div class="topright">
        <span class="livetxt" id="liveStat"></span>
        <div class="topicons">
          <button class="iconbtn" id="btnGithub" data-github="1" title="打开 GitHub 发布页" aria-label="GitHub 发布页">
            <svg viewBox="0 0 16 16"><path d="M6 13.2c-2.9.9-2.9-1.6-4-2m8 3.4v-2.6c0-.7-.2-1.3-.6-1.8 2-.2 4-1 4-4.4 0-1-.3-1.8-.9-2.4.1-.3.4-1.3-.1-2.5 0 0-.8-.3-2.6 1a8.9 8.9 0 0 0-4.6 0C3.4.1 2.6.4 2.6.4c-.5 1.2-.2 2.2-.1 2.5-.6.6-.9 1.4-.9 2.4 0 3.4 2 4.2 4 4.4-.3.3-.5.7-.6 1.2v3"/></svg>
            <span>发布页</span></button>
          <button class="iconbtn sponsor" id="btnSponsor" data-sponsor="1" title="赞助作者" aria-label="赞助作者">
            <svg viewBox="0 0 16 16"><path d="M8 13.6 2.6 8.5a3.1 3.1 0 0 1 0-4.5 3.2 3.2 0 0 1 4.5 0L8 4.9l.9-.9a3.2 3.2 0 0 1 4.5 0 3.1 3.1 0 0 1 0 4.5L8 13.6Z"/></svg>
            <span>赞助</span></button>
        </div>
        <div id="topacts"></div>
      </div>
    </header>

    <!-- 账号状态 -->
    <section class="page" id="page-inst">
      <div class="kpis" id="kpis"></div>

      <div class="bar">
        <div class="barleft" id="envLeft"></div>
        <div class="barright" id="envRight"></div>
      </div>
      <div class="cards" id="cards"></div>
      <div class="empty hidden" id="instEmpty">
        <p>没有实例在线。</p>
        <p class="dim">游戏没开、没登录、助手没装、端口被占——四个原因之一。到「沙箱」页点启动。</p>
      </div>

      <div class="bar">
        <div class="barleft"><h2>最近掉落</h2><span class="count" id="recentCount">0 条</span></div>
        <div class="barright"><button class="btn" data-goto="loot">查看全部记录</button></div>
      </div>
      <div class="tablecard"><table class="tbl" id="recentTable"></table></div>
    </section>

    <!-- 掉落 -->
    <section class="page hidden" id="page-loot">
      <div class="kpis" id="lootKpis"></div>
      <div class="filters" id="lootFilter"></div>
      <div class="tablecard"><table class="tbl" id="lootTable"></table></div>
    </section>

    <!-- 沙箱 -->
    <section class="page hidden" id="page-sandbox">
      <div class="kpis" id="sbKpis"></div>
      <div class="bar">
        <div class="barleft"><h2>沙箱</h2><span class="count" id="boxCount">0 个</span></div>
        <div class="barright" id="sbActions"></div>
      </div>
      <div class="tablecard"><table class="tbl" id="boxTable"></table></div>
      <div class="bar">
        <div class="barleft"><h2>游戏进程</h2><span class="count" id="procCount">0 个</span></div>
        <div class="barright"><button class="btn" data-top="togglewin">全部隐藏窗口</button></div>
      </div>
      <div class="tablecard"><table class="tbl" id="procTable"></table></div>
    </section>

    <!-- 设置 -->
    <section class="page hidden" id="page-settings">
      <div class="stack" id="settingsBody"></div>
    </section>

    <footer class="foot">
      <span class="fbrand">Idle Legions 多开中控</span>
      <span class="fver" id="footVer">v—</span>
      <span class="fauthor">by AWan</span>
      <span class="fspace"></span>
      <span class="ftip" id="footTip">关闭窗口会缩到任务栏</span>
    </footer>
  </main>
</div>

<aside class="drawer" id="drawer">
  <div class="dhead">
    <div>
      <h2 id="dtitle">实例</h2>
      <span class="dsub" id="dsub"></span>
    </div>
    <button class="btn icon" id="dclose" title="关闭">✕</button>
  </div>
  <div class="dacts" id="dacts"></div>
  <div class="tabs" id="dtabs"></div>
  <div class="dbody" id="dbody"></div>
</aside>
<div class="scrim" id="scrim"></div>
<div class="toasts" id="toasts"></div>
<script src="/web/app.js"></script>
</body>
</html>
